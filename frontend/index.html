<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastRoutes - Mapa de Despacho</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #000000;
            --muted: #6b6f8d;
            --violeta: #000000;
            --violeta-suave: #ece8ff;
            --almacen: #12b886;
            --linea: #e4e5ee;
            --fondo: #ffffff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Sora', system-ui, sans-serif; color: var(--ink); }
        #map { width: 100vw; height: 100vh; background: #e9eef2; }

        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 300px;
            background: var(--fondo);
            border-radius: 16px;
            z-index: 1000;
            box-shadow: 0 8px 30px rgba(27, 27, 58, 0.18);
            overflow: hidden;
        }
        .marca {
            padding: 18px 20px 14px;
            background: var(--ink);
            color: white;
        }
        .marca h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; line-height: 1; }
        .marca .fast { font-weight: 800; }
        .marca .routes { font-weight: 300; }
        .marca p { margin: 6px 0 0; font-size: 12px; color: #b9bbd6; }

        .cuerpo { padding: 16px 20px 20px; }
        label.titulo { font-size: 13px; font-weight: 600; display: block; }
        select, button {
            width: 100%;
            margin-top: 8px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
        }
        select { border: 1px solid var(--linea); background: white; color: var(--ink); }
        button { border: 0; font-weight: 600; transition: transform .1s ease, box-shadow .15s ease; }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: wait; }
        button:focus-visible, select:focus-visible { outline: 3px solid var(--violeta); outline-offset: 2px; }
        .btn-secundario { background: var(--violeta-suave); color: var(--violeta); }
        .btn-principal { background: var(--violeta); color: white; box-shadow: 0 6px 16px rgba(91, 61, 245, 0.35); }

        hr { border: 0; border-top: 1px solid var(--linea); margin: 16px 0; }
        .paradas { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; }
        #contador { font-size: 22px; font-weight: 800; color: var(--violeta); }
        .ayuda { font-size: 12px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }

        #resultado { margin-top: 14px; display: none; }
        .metricas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metrica { background: #f6f6fb; border-radius: 10px; padding: 10px 12px; }
        .metrica span { display: block; font-size: 11px; color: var(--muted); }
        .metrica b { font-size: 17px; }
        .metrica.total { grid-column: 1 / -1; background: var(--violeta-suave); }
        .metrica.total b { color: var(--violeta); font-size: 22px; }

        /* Marcadores */
        .pin { display: flex; align-items: center; justify-content: center; border-radius: 50%;
               color: white; font-weight: 800; font-family: 'Sora', sans-serif;
               border: 3px solid white; box-shadow: 0 3px 10px rgba(27,27,58,.4); }
        .pin-almacen { width: 38px; height: 38px; background: var(--almacen); }
        .pin-entrega { width: 30px; height: 30px; background: var(--violeta); font-size: 13px; }

        .leaflet-control-zoom { border: 0 !important; box-shadow: 0 4px 14px rgba(27,27,58,.2) !important; }

        @media (max-width: 600px) {
            #panel { top: auto; bottom: 0; left: 0; width: 100%; border-radius: 16px 16px 0 0; }
            .leaflet-bottom.leaflet-right { display: none; }
        }
    </style>
</head>
<body>

    <div id="panel">
        <div class="marca">
            <h1><span class="fast">FAST</span><span class="routes">Routes</span></h1>
            <p>La ruta más corta para todas tus entregas</p>
        </div>

        <div class="cuerpo">
            <label class="titulo" for="ciudad">Ciudad base</label>
            <!-- Cada value tiene: latitud, longitud, nivel_de_zoom -->
            <select id="ciudad" onchange="cambiarCiudad()">
                <option value="-12.0464,-77.0428,12">Lima</option>
                <option value="-16.4090,-71.5375,13">Arequipa</option>
                <option value="-13.5320,-71.9675,14">Cusco</option>
                <option value="-8.1091,-79.0215,13">Trujillo</option>
                <option value="-5.1945,-80.6328,13">Piura</option>
            </select>

            <hr>

            <div class="paradas"><span>Puntos de despacho</span><span id="contador">0</span></div>
            <p class="ayuda">Toca el mapa: primero el almacén y luego cada entrega.</p>

            <button class="btn-secundario" onclick="limpiarMapa()">Limpiar todo</button>
            <button id="btnRuta" class="btn-principal" onclick="calcularRuta()">Calcular ruta de entrega</button>

            <div id="resultado">
                <hr>
                <div class="metricas">
                    <div class="metrica"><span>Distancia</span><b id="rDistancia">-</b></div>
                    <div class="metrica"><span>En movimiento</span><b id="rMovimiento">-</b></div>
                    <div class="metrica"><span>Tiempo de servicio</span><b id="rServicio">-</b></div>
                    <div class="metrica"><span>Paradas</span><b id="rParadas">-</b></div>
                    <div class="metrica total"><span>Tiempo total estimado</span><b id="rTotal">-</b></div>
                </div>
                <p class="ayuda" id="rMetodo"></p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_URL = '/api';

        const mapa = L.map('map', { zoomControl: false }).setView([-12.0464, -77.0428], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(mapa);

        // Mapas base con color y sin API key (se puede cambiar desde el control de capas)
        const calles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri — Esri, HERE, Garmin, OpenStreetMap contributors'
        });
        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });
        const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri — Maxar, Earthstar Geographics'
        });

        calles.addTo(mapa);
        L.control.layers(
            { 'Calles': calles, 'OpenStreetMap': osm, 'Satélite': satelite },
            null,
            { position: 'topright' }
        ).addTo(mapa);

        let puntosDespacho = [];
        let marcadores = [];
        let capaRuta = null;

        function cambiarCiudad() {
            const seleccion = document.getElementById('ciudad').value;
            const [lat, lng, zoom] = seleccion.split(',');
            mapa.setView([parseFloat(lat), parseFloat(lng)], parseInt(zoom));
            limpiarMapa();
        }

        // Iconos propios (HTML/CSS) en lugar de los pines azules por defecto
        const iconoAlmacen = L.divIcon({
            className: '',
            html: `<div class="pin pin-almacen">
                     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                   </div>`,
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        function iconoEntrega(n) {
            return L.divIcon({
                className: '',
                html: `<div class="pin pin-entrega">${n}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        mapa.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            puntosDespacho.push([lng, lat]);

            let marcador;
            if (puntosDespacho.length === 1) {
                marcador = L.marker([lat, lng], { icon: iconoAlmacen })
                    .bindTooltip("Almacén (inicio y fin)", { direction: 'top', offset: [0, -16] })
                    .addTo(mapa);
            } else {
                const n = puntosDespacho.length - 1;
                marcador = L.marker([lat, lng], { icon: iconoEntrega(n) })
                    .bindTooltip(`Entrega #${n}`, { direction: 'top', offset: [0, -12] })
                    .addTo(mapa);
            }

            marcadores.push(marcador);
            document.getElementById('contador').innerText = puntosDespacho.length - 1;
        });

        function limpiarMapa() {
            puntosDespacho = [];
            marcadores.forEach(m => mapa.removeLayer(m));
            marcadores = [];
            if (capaRuta) {
                mapa.removeLayer(capaRuta);
                capaRuta = null;
            }
            document.getElementById('contador').innerText = 0;
            document.getElementById('resultado').style.display = 'none';
        }

        // Dibuja la ruta con borde blanco + línea violeta, puntas y uniones redondeadas
        function dibujarRuta(geometry) {
            if (capaRuta) mapa.removeLayer(capaRuta);

            const base = { lineCap: 'round', lineJoin: 'round', smoothFactor: 0.5 };
            const borde = L.geoJSON(geometry, {
                style: { ...base, color: '#ffffff', weight: 10, opacity: 0.95 }
            });
            const linea = L.geoJSON(geometry, {
                style: { ...base, color: '#5b3df5', weight: 6, opacity: 1 }
            });

            capaRuta = L.layerGroup([borde, linea]).addTo(mapa);
            mapa.fitBounds(linea.getBounds(), { padding: [60, 60] });
        }

        // Los pines pasan a mostrar el orden de visita óptimo (no el orden de clic)
        function renumerarEntregas(orden) {
            orden.forEach((clic, i) => {
                const m = marcadores[clic];
                m.setIcon(iconoEntrega(i + 1));
                m.setTooltipContent(`Parada ${i + 1} (clic #${clic})`);
            });
        }

        async function calcularRuta() {
            if (puntosDespacho.length < 2) {
                alert("Selecciona el almacén y al menos 1 punto de despacho en el mapa.");
                return;
            }

            const btn = document.getElementById('btnRuta');
            btn.disabled = true;
            btn.innerText = 'Calculando... (la 1.ª vez descarga el mapa)';

            try {
                const respuesta = await fetch(`${API_URL}/ruta`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ciudad: document.getElementById('ciudad').selectedOptions[0].text,
                        puntos: puntosDespacho
                    })
                });
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    alert(datos.error || "No se pudo calcular la ruta.");
                    return;
                }

                dibujarRuta(datos.geometry);
                renumerarEntregas(datos.orden);
                document.getElementById('rMetodo').innerText = 'Orden de visita ' + datos.metodo;

                document.getElementById('rDistancia').innerText = (datos.distancia_m / 1000).toFixed(2) + ' km';
                document.getElementById('rMovimiento').innerText = datos.duracion_movimiento_min + ' min';
                document.getElementById('rServicio').innerText = datos.tiempo_servicio_min + ' min';
                document.getElementById('rParadas').innerText = datos.paradas;
                document.getElementById('rTotal').innerText = datos.tiempo_total_min + ' min';
                document.getElementById('resultado').style.display = 'block';
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el backend. ¿Está corriendo app.py?");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Calcular ruta de entrega';
            }
        }

        // ---- Rastreo GPS en vivo ----
        let marcadorGPS = null;
        let circuloPrecision = null;

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(posicion => {
                const lat = posicion.coords.latitude;
                const lng = posicion.coords.longitude;
                const precision = posicion.coords.accuracy;

                if (marcadorGPS) {
                    marcadorGPS.setLatLng([lat, lng]);
                    circuloPrecision.setLatLng([lat, lng]);
                    circuloPrecision.setRadius(precision);
                } else {
                    marcadorGPS = L.marker([lat, lng], {
                        icon: L.divIcon({
                            className: 'gps-marker',
                            html: '<div style="background-color: #1b1b3a; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>',
                            iconSize: [22, 22],
                            iconAnchor: [11, 11]
                        }),
                        zIndexOffset: 1000
                    }).addTo(mapa);

                    circuloPrecision = L.circle([lat, lng], {
                        radius: precision,
                        color: '#1b1b3a',
                        fillOpacity: 0.12,
                        weight: 1
                    }).addTo(mapa);
                }
            }, error => {
                console.warn("No se pudo obtener la ubicación:", error.message);
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        }
    </script>
</body>
</html>
